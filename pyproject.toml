[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-spice"
version = "1.9.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autofig~=1.2.0",
    "cmasher~=1.9.2",
    "jaxtyping~=0.2.36",
    "jax>=0.10",
    "jaxkd>=0.1.2",
    "jaxlib>=0.10",
    "numpy>=2.0,<3",
    "overrides~=7.7.0",
    "flax>=0.12",
    "h5py>=3.13",
    "astropy>=5.0",
    "tqdm>=4.65"
]

[project.optional-dependencies]
huggingface = ["huggingface-hub>=0.21.3"]
dev = ["pytest~=8.0.0", "pytest-datadir~=1.5.0", "coverage~=7.4.3", "chex>=0.1.88"]
phoebe = ["phoebe~=2.4.17"]
aemu = ["astro-emulators-toolkit>=0.2.0,<0.3"]
# Zarr-backed spectral grid interpolation (LazyZarrInterpolator family and
# spice.spectrum.generate_zarr_index).
grid = ["zarr>=3", "pandas", "polars", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spice = ["icosphere_cache/*.pickle", "spectrum/filter_data/*"]

[tool.pytest.ini_options]
python_classes = ["Test", "Describe"]
python_functions = ["test_", "it_", "and_", "but_", "they_"]
python_files = ["test_*.py",]
testpaths = ["tests",]
pythonpath = ["src"]
